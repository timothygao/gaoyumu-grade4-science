const bank=[["桥梁","连接两处、让人或车辆跨越河流等障碍的建筑物。","书籍是连接古今的桥梁。","连接古代与现代、帮助人了解历史的媒介。"],["沸腾","液体受热到一定温度时，内部和表面同时发生剧烈汽化的现象。","比赛获胜后，操场上沸腾起来。","大家非常热烈、激动，欢呼声不断。"],["火焰","物体燃烧时发出的光和热所形成的可见部分。","英雄的事迹在我心中点燃了一团火焰。","英雄事迹激起了强烈的敬佩和奋发向上的热情。"],["狡猾","善于耍花招、用不正当的办法达到目的。通常含贬义。","小猫可狡猾了，趁我转身就叼走了鱼。","这里带有亲昵、调侃的意味，写出小猫机灵调皮。"],["屏障","用来阻隔、保护或遮挡的事物。","一排大树成了村庄的绿色屏障。","树木阻挡风沙，保护村庄。"],["凝聚","聚集在一起；也指力量、情感等集中起来。","这座小桥凝聚着全班同学的心血。","小桥是大家共同努力的成果。"],["徘徊","在一个地方来回走动；也可指犹豫不决。","他在报名处徘徊了很久，还是没有进去。","他犹豫是否报名，尚未拿定主意。"],["奔腾","水流或马匹等迅猛地向前运动。","听完故事，我心潮奔腾。","内心情绪十分激荡，难以平静。"],["滋润","使干燥的事物变得湿润；也指给予滋养。","老师的鼓励滋润了我的心田。","鼓励使我感到温暖、有信心。"],["珍惜","重视并爱护有价值的人、事物或机会。","他很珍惜每次和爷爷相处的时间。","他十分重视与爷爷相处的机会，不愿浪费。"],["启迪","启发、开导，使人产生新的认识。","这次实验给了我很大的启迪。","实验帮助我获得了新的认识。"],["坚韧","坚固而有韧性；也形容意志坚定，不轻易屈服。","面对一次次失败，她表现得十分坚韧。","她不轻易放弃，能坚持克服困难。"],["萌芽","植物刚开始发芽；也指事物刚开始形成。","他的科学梦想在那次参观后萌芽了。","他从那次参观开始产生了科学梦想。"],["沉重","重量大；也形容心情、负担或责任很重。","听到小狗走失的消息，他的心情很沉重。","他因担忧和难过而心里不好受。"]], emo=[["敬佩","对值得尊敬的人的品质或行为产生佩服的感情。","消防员不顾危险救出被困的人，小明由衷地佩服他。",["敬佩","感激","羡慕"],0,"敬佩着重于佩服对方的品质；感激着重受到帮助后的感谢；羡慕着重希望自己也拥有。"],["激动","受到较强刺激，情绪强烈而难以平静。","比赛最后一秒，球队反超获胜，他跳起来大喊。",["期待","激动","欣慰"],1,"激动强调情绪突然强烈；期待是盼望尚未发生的事；欣慰强调放心和满足。"],["感动","因为受到某种言行或事物的触动而产生较深情感。","同学默默陪伴受伤的他，每天帮他背书包，他眼眶湿润。",["兴奋","羡慕","感动"],2,"感动强调内心受触动；兴奋强调情绪高涨；羡慕强调向往别人拥有的事物。"],["期待","盼望某件尚未发生的事情到来。","明天要去海边，他早早收好行李，盼着天亮。",["期待","感激","惊讶"],0,"期待是盼望未来；感激是感谢；惊讶是对意外感到吃惊。"],["忐忑","心神不定，因担忧而不安。","忘记带作业，他不知道老师会怎样处理，心里七上八下。",["失望","忐忑","愤怒"],1,"忐忑是不确定带来的不安；失望是希望落空；愤怒是强烈生气。"],["欣慰","因满意、安心而感到高兴。","看到原本怕水的孩子终于学会游泳，爸爸放心地笑了。",["嫉妒","焦急","欣慰"],2,"欣慰包含放心和满意；嫉妒因别人好而不快；焦急强调急切不安。"],["懊悔","因自己过去的错误而后悔。","他明知不该嘲笑同学却还是做了，事后恨不得收回那句话。",["懊悔","失落","羡慕"],0,"懊悔针对自己的错误；失落是愿望落空后的低落；羡慕是向往别人。"],["委屈","受到不公平对待或被误解而感到难过。","明明不是他弄坏了花盆，却被批评了，他忍不住哭了。",["遗憾","委屈","自豪"],1,"委屈来自不公或误解；遗憾是未能如愿；自豪是为成绩或价值骄傲。"],["焦急","非常着急，迫切希望事情得到解决。","快开车了，弟弟还没回来，他不停看表。",["安慰","愉快","焦急"],2,"焦急包含时间压力和担心；安慰是使人安心；愉快是快乐。"],["崇拜","对某人或某种精神怀有特别强烈的敬仰。","他把那位科学家当成榜样，收集他的故事，立志成为那样的人。",["崇拜","感谢","惋惜"],0,"崇拜强调高度敬仰和向往；感谢针对恩惠；惋惜是对损失感到可惜。"],["惋惜","对不好的结果、损失或错过的机会感到可惜。","一株珍贵的古树因暴风雨倒下，大家觉得太可惜了。",["愤怒","惋惜","自豪"],1,"惋惜强调可惜；愤怒强调生气；自豪强调骄傲。"],["愧疚","因觉得自己对不起别人而内心不安。","他答应陪奶奶散步却忘了，想到奶奶等了很久，心里很不好受。",["惊讶","欣慰","愧疚"],2,"愧疚着重对不起他人；惊讶是意外；欣慰是满意放心。"],["失落","因失去某物、愿望未实现等而心情低落。","他期待很久的旅行取消了，一个人闷闷不乐地坐着。",["失落","敬佩","感激"],0,"失落来自希望落空或失去；敬佩是佩服；感激是感谢。"],["自豪","因自己或所属集体取得成绩、有价值的表现而感到骄傲。","全班合作完成比赛，他觉得自己是这个集体的一员很光荣。",["紧张","自豪","委屈"],1,"自豪强调对自己或集体的认同；紧张是不安；委屈源自误解或不公平。"]];
const textbook=[[1,"浩浩荡荡","特定语境","运动会结束后，几百名同学举着各色旗帜，排着长队，浩浩荡荡地走回教室。","形容水势广阔盛大，也形容声势雄壮、规模很大。","这里指同学人数多、队伍长、行进声势大。线索是几百名同学和长队。","写出了队伍规模大、气势足的场面，表现热烈的气氛。"],[4,"敬佩","感情色彩","看到消防员冒着危险救出被困的人，小林望着他们，心中充满了敬佩。","尊敬并佩服。","褒义词；文中指小林尊敬消防员，并佩服他们勇敢救人的行为。","准确表现小林对消防员勇敢品质的赞赏，不只是受到帮助后的感激。"],[1,"余波","修辞手法","演出结束了，掌声早已停下，可那首歌的余波仍在我的心里回荡。","水面波动后留下的波浪，也比喻事情过后的影响。","把歌声留下的影响比作尚未消散的水波，指演出结束后心里仍受触动。","生动写出歌声带来的感受久久没有消失，表现难忘和喜爱。"],[4,"屈服","时代背景","抗日战争时期，一些村庄遭到侵略者的威胁。村民冒着危险保护乡亲，面对恐吓，他们没有屈服。","在外力或压力下被迫服从、退让。","当时人们面对侵略和威胁；这里指村民不向侵略者低头，不放弃保护乡亲。","表现村民不畏强暴、坚持抵抗的勇气，表达对他们的敬佩。"],[1,"风平浪静","特定语境","班里原先为比赛分组吵得不可开交。老师让大家商量，终于定下公平的办法，教室里又风平浪静了。","风浪停止，水面平静；也形容平静无事。","这里指争吵停止，同学们恢复平静。线索是终于定下公平的办法。","形象地写出争执解决后气氛由紧张转为平静。"],[2,"胸有成竹","感情色彩","同学们正为难题发愁，小雨却已经画好草图，胸有成竹地拿起笔开始解答。","做事之前已经有了成熟的考虑或把握。","通常带褒义；小雨已画好草图，心中有了解题办法。","突出小雨准备充分、有把握的状态，表现对她的肯定。"],[1,"山崩地裂","修辞手法","球赛最后一刻进球了，看台上的欢呼声仿佛山崩地裂，连场边的人都忍不住捂住耳朵。","山岳倒塌，大地裂开；形容声势巨大。","运用夸张，形容欢呼声音极大，并非真的发生山崩地裂。","突出欢呼声的响亮和现场的热烈，表现观众的激动。"],[4,"艰难","时代背景","过去交通不便，山区孩子上学要翻山越岭，雨天泥路湿滑，他们仍然坚持上学。那段求学的日子十分艰难。","困难、辛苦，不容易。","当时山区交通条件差；这里指孩子上学路途远、路况差、十分辛苦。","突出当时求学的不易，表现孩子的坚持，令人敬佩。"],[1,"柔和","特定语境","病房里很安静。护士把窗帘拉上一半，用柔和的声音安慰害怕打针的小女孩。","柔软、温和，不强烈、不生硬。","这里指护士声音轻缓温和，没有急躁或严厉。","写出护士的耐心体贴，使紧张的气氛缓和。"],[3,"瞧不起","感情色彩","小杰学跑步比别人慢，有人瞧不起他。可他每天练习，后来跑得越来越快。","轻视别人，认为别人不值得重视。","含贬义；这里指有人因为小杰跑得慢就轻视他。","表现这些人的不尊重，与小杰的坚持形成对比。"],[1,"沉睡","修辞手法","夜深了，路灯下没有一个行人，街道上的店铺都关了门，整座小城沉睡了。","睡得很熟；也可比喻处于安静、不活动的状态。","用拟人，把小城写成睡着的人，指夜里街道安静、活动停止。","生动描绘夜晚的宁静，表现小城安详的气氛。"],[2,"胜利","时代背景","从前，我国运动员训练条件有限，器材也不充足。经过多年刻苦练习，他们终于在国际比赛中取得胜利。观众激动地挥舞着国旗。","在斗争、比赛等活动中获得成功。","训练条件有限却长期坚持；这里指运动员克服困难，在国际比赛中获胜。","突出成绩来之不易，表现观众的激动和民族自豪感。"],[2,"敏锐","特定语境","小狗趴在门边，屋外刚传来轻轻的脚步声，它立刻抬起头，竖起耳朵。它的听觉真敏锐。","感觉灵敏，能迅速察觉细微变化。","这里指小狗能很快听见轻微脚步声。","突出小狗听觉灵敏，表现观察者的赞叹。"],[3,"慎重","感情色彩","选班级代表时，小华没有随便投票，而是认真比较每位同学的表现，慎重地作出了选择。","谨慎认真，不轻率。","此处带肯定意味，指小华考虑充分后才作出选择。","表现小华认真负责的态度。"],[3,"痕迹","修辞手法","老师早已退休，但她当年一句句耐心的鼓励，在我的心里留下了深深的痕迹。","物体留下的印迹，也指事情留下的影响。","把老师鼓励留下的长久影响比作印迹，指这些话一直影响自己。","使看不见的影响变得具体，表达对老师的感激和怀念。"],[4,"忍受","时代背景","过去，一些地方的饮水要靠人走很远的路挑回来。为了让全村用上干净的水，修渠的人忍受着烈日和劳累，天天坚持干活。","把痛苦、困难或不舒服的感受承受下来。","当时生活取水困难；这里指修渠的人承受高温和疲劳，仍坚持劳动。","突出劳动的辛苦和奉献，表达敬佩。"],[1,"模糊","特定语境","我小时候搬过一次家。如今再想起那条老街，只记得门口有棵树，其他样子已经很模糊了。","不清楚，不分明。","这里指对老街的记忆已经不清楚，许多细节想不起来。","表现时间久远、记忆逐渐淡去的状态。"],[4,"气急败坏","感情色彩","比赛输了，他不肯接受结果，气急败坏地把球扔在地上，还冲队友发脾气。","形容十分生气或慌乱，失去平静的样子。","通常含贬义；这里指他因输球又急又怒，举止失去控制。","突出人物输球后恼怒失态的表现，含有批评意味。"],[2,"障碍","修辞手法","练习写作文时，我总担心自己写不好。老师说，害怕失败才是前进路上的最大障碍。","阻挡通行或妨碍事情进行的事物。","把害怕失败比作道路上的阻挡物，指这种心理妨碍自己进步。","形象地揭示困难来自内心，强调克服恐惧的重要性。"],[3,"简朴","时代背景","过去物资较为缺乏，许多家庭的家具都是自己做的。一位教师多年把节省下的钱买书送给学生，自己的生活却十分简朴。","简单朴素，不讲究奢华。","当时物资有限；文中教师主动节省生活开支，把钱用在学生身上。","表现教师朴素生活、关心学生的品质，表达敬意。"],[3,"隐蔽","特定语境","树林里，一只小鸟把窝搭在浓密的枝叶间。不仔细拨开叶子，根本看不到这个隐蔽的鸟窝。","借助遮挡而不容易被发现；也形容隐藏得不明显。","这里指鸟窝被浓密枝叶遮住，不容易被人看到。","突出鸟窝位置不易发现的特点，让人感受到小鸟选择位置的巧妙。"],[4,"坚定","感情色彩","虽然同学们说这次长跑太难，她仍坚定地说：我会坚持跑到终点。","立场、意志等稳定坚强，不轻易动摇。","此处含肯定意味，指她面对困难仍不改变坚持跑完的决心。","突出她意志坚强、勇于面对困难的品质。"],[4,"奔流不息","修辞手法","家乡的人一代代把手艺传给后辈。这份文化像一条奔流不息的河，流进了新的时代。","水流不停地向前奔涌。","用比喻把代代相传的文化比作不断流动的河，指文化持续传承。","生动表现文化传承的连续性和生命力，表达赞美。"],[2,"黑暗","时代背景","战争年代，许多孩子不能安稳上学。即使在那段黑暗的日子里，一位老师仍设法为孩子们教书。","没有光亮；也比喻社会处境艰苦、缺乏光明和希望。","当时战争使生活不安定；这里指孩子们生活困苦、学习受到影响的日子。","突出战争时期的艰难，衬托老师坚持教书带来的希望。"],[2,"兴致勃勃","特定语境","参观科技馆时，小文一路不停提问，还主动排队体验每个实验，兴致勃勃地听讲解。","兴趣浓厚，情绪高涨。","这里指小文对科技馆的实验十分感兴趣，积极参与。","表现他强烈的好奇心和参观时的愉快心情。"],[4,"严厉","感情色彩","小安差点闯红灯，爸爸严厉地批评了他。回家后，爸爸又耐心地讲解交通规则。","严肃而严格，态度不宽松。","在这里指爸爸因危险行为而态度严肃地批评小安，并非出于厌恶。","表现爸爸对安全规则的重视，也体现对孩子安全的关心。"],[3,"枯萎","修辞手法","一次次失败后，他对画画的信心渐渐枯萎了，直到老师鼓励他重新拿起画笔。","植物因缺水等原因干枯、衰败。","把信心比作逐渐枯萎的植物，指他慢慢失去了信心。","形象表现信心逐渐消失的过程，突出后来鼓励的重要性。"],[4,"幸福","时代背景","过去村里没有自来水，人们每天要走很远挑水。后来通了自来水，拧开水龙头就能用水。爷爷笑着说，现在的日子真幸福。","生活或愿望得到满足而感到快乐、满足。","以前取水不便，如今生活条件改善；爷爷因便利的生活而感到满足。","通过今昔对比突出生活改善，表现爷爷的喜悦和珍惜。"],[1,"窃窃私语","特定语境","图书馆里大家都在安静阅读。两个同学靠得很近，窃窃私语，生怕打扰别人。","背着别人或私下小声说话。","这里指两个同学压低声音交流，怕打扰其他读者。","写出声音轻、环境安静的特点。"],[2,"跃跃欲试","感情色彩","老师展示了纸飞机比赛的规则。同学们纷纷拿起纸，有的已经开始折飞机，大家都跃跃欲试。","形容急切地想试一试。","通常带积极意味；这里指同学们对比赛感兴趣，迫不及待想参加。","表现同学们积极参与的热情和期待。"],[1,"怀抱","修辞手法","放学后，我站在山坡上远望，村子静静地躺在群山的怀抱里。","用手臂抱着，或指胸前抱住东西的地方。","运用拟人，把群山写成有怀抱的人，指群山环绕村子。","形象描绘村子被群山环抱的景象，表现宁静与亲切。"],[4,"精疲力竭","时代背景","过去山区没有公路，修路的人靠肩挑手抬搬运石块。一天干下来，他们常常精疲力竭，却还是第二天继续上山。","精神和体力都消耗得很厉害，十分疲劳。","当时缺少便利交通和机械，劳动强度大；这里指修路工人干了一天十分疲惫。","突出修路工作的艰辛，衬托劳动者的坚持与奉献。"]];

const BY=Object.fromEntries([...LEGACY,...WORDS].map(w=>[w.id,w])), STORE="daily-two-words-v1",QUIZ="grade4_daily_two_words_v1",SEM="四年级上册";

function streak(id){let count=0,seen=new Set();for(const r of records(id).reverse()){if(seen.has(r.day))continue;seen.add(r.day);if(!r.ok)break;count++}return Math.min(3,count)}
